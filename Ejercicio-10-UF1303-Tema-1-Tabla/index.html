<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Tabla de tipos de cambio</title>

  <style>
    /* ===========================
       ESTILO GENERAL DE LA PÁGINA
    =========================== */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      margin: 40px;
      text-align: center;
    }

    h1 {
      color: #004080;
      margin-bottom: 25px;
    }

    /* ===========================
       TABLA
    =========================== */
    table {
      margin: 0 auto;
      border-collapse: collapse;
      width: 700px;
      font-size: 14px;
      background-color: #ffffff;
      box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.1);
    }

    th, td {
      border: 1px solid #999;
      padding: 8px 12px;
      text-align: center;
    }

    th {
      background-color: #e0e0e0;
      font-weight: bold;
    }

    td {
      background-color: #ffffe0;
    }

    /* ===========================
       CELDAS RESALTADAS
    =========================== */
    .resaltado {
      background-color: #ffff99; 
    }

    /* ===========================
       COLUMNA DE CAMBIO
    =========================== */
    .cambio {
      text-align: left;
      background-color: #f8f8f8;
      font-weight: bold;
    }

    /* ===========================
       ICONOS DE BANDERAS
    =========================== */
    .icono {
      width: 16px;
      height: 12px;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* ===========================
       ENLACES
    =========================== */
    a {
      text-decoration: none;
      color: #000;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===========================
       EFECTO HOVER EN CELDAS
    =========================== */
    th:hover, td:hover {
      background-color: #FFFF66;
    }

    /* ===========================
       PIE DE PÁGINA
    =========================== */
    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>Tipos de Cambio</h1>

  <table>
    <tr>
      <th>Cambio</th>
      <th>Compra</th>
      <th>Venta</th>
      <th>Máximo</th>
      <th>Mínimo</th>
    </tr>

    <tr>
      <td class="cambio">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b7/Flag_of_Europe.svg" alt="Euro" class="icono">
        <a href="https://es.wikipedia.org/wiki/Euro" target="_blank">Euro/Dólar</a>
      </td>
      <td>1.25</td>
      <td>1.25</td>
      <td>1.25</td>
      <td>1.24</td>
    </tr>

    <tr>
      <td class="cambio">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="Dólar" class="icono">
        <a href="https://es.wikipedia.org/wiki/Dólar_estadounidense" target="_blank">Dólar/Yen</a>
      </td>
      <td class="resaltado">119.01</td>
      <td class="resaltado">119.05</td>
      <td class="resaltado">119.82</td>
      <td class="resaltado">119.82</td>
    </tr>

    <tr>
      <td class="cambio">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/ae/Flag_of_the_United_Kingdom.svg" alt="Libra" class="icono">
        <a href="https://es.wikipedia.org/wiki/Libra_esterlina" target="_blank">Libra/Dólar</a>
      </td>
      <td>1.86</td>
      <td>1.86</td>
      <td>1.86</td>
      <td>1.85</td>
    </tr>

    <tr>
      <td class="cambio">
        <img src="https://upload.wikimedia.org/wikipedia/en/9/9e/Flag_of_Japan.svg" alt="Yen" class="icono">
        <a href="https://es.wikipedia.org/wiki/Yen" target="_blank">Yen/Euro</a>
      </td>
      <td>0.67</td>
      <td>0.67</td>
      <td>0.66</td>
      <td>0.67</td>
    </tr>
  </table>

  <footer>
    <p>© 2025 Actividad de la tabla de valores</p>
  </footer>

</body>
</html>
