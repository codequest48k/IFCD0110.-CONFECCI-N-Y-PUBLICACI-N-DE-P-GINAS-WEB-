<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <style>
        /* Estilos Generales */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4; /* Fondo gris claro */
            display: flex;
            justify-content: center;
            padding: 40px;
            margin: 0;
        }

        /* Contenedor del formulario, imitando el borde de la imagen */
        .form-container {
            background-color: white;
            border: 1px solid #ccc;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        /* Estilo para las etiquetas y los campos de texto/contraseña */
        .form-group {
            display: flex; /* Usamos flex para alinear la etiqueta y el campo */
            align-items: center;
            margin-bottom: 15px;
        }

        label {
            width: 100px; /* Ancho fijo para alinear las cajas de texto */
            text-align: left;
            margin-right: 10px;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="password"] {
            padding: 5px;
            border: 1px solid #999;
            width: 200px; /* Ancho fijo para simular el diseño */
        }

        /* Estilos para los campos de Género (Radio Buttons) */
        .gender-options {
            display: flex;
            align-items: center;
        }

        .gender-options label {
            width: auto; /* Desactivamos el ancho fijo para estas etiquetas */
            margin-right: 15px;
        }

        /* Estilos para las casillas de verificación (Checkboxes) */
        .checkbox-group {
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .checkbox-group label {
            width: auto;
            margin-left: 5px;
            font-weight: normal;
        }
        
        /* Estilo para el botón Enviar */
        button[type="submit"] {
            padding: 8px 20px;
            background-color: #f0f0f0; /* Color gris suave como en la imagen */
            border: 1px solid #777;
            cursor: pointer;
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="form-container">
        
        <!-- Formulario de Registro -->
        <form action="#" method="post">
            
            <!-- Campo Nombre -->
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <!-- Campo Apellidos -->
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" required>
            </div>

            <!-- Campo Género (Radio Buttons) -->
            <div class="form-group">
                <label>Género:</label>
                <div class="gender-options">
                    <input type="radio" id="hombre" name="genero" value="hombre" required>
                    <label for="hombre">Hombre</label>
                    <input type="radio" id="mujer" name="genero" value="mujer">
                    <label for="mujer">Mujer</label>
                </div>
            </div>

            <!-- Campo Email -->
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!-- Checkbox: Novedades y Noticias (Seleccionado por defecto) -->
            <div class="checkbox-group">
                <input type="checkbox" id="novedades" name="novedades" checked>
                <label for="novedades">Deseo recibir información sobre novedades y ofertas.</label>
            </div>

            <!-- Checkbox: Condiciones (Obligatorio) -->
            <div class="checkbox-group">
                <input type="checkbox" id="condiciones" name="condiciones" required>
                <label for="condiciones">Declaro haber leído y acepto las condiciones generales y la normativa sobre protección de datos.</label>
            </div>

            <!-- Botón de Envío -->
            <button type="submit">Enviar</button>

        </form>
    </div>

</body>
</html>
