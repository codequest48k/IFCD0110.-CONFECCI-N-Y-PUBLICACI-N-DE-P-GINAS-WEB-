<head>
    <!-- Avoid FOUC issue in FF with async loading of style sheets -->

        body {
            opacity: 0;
        }

    <title>Cafe Supremo Intranet</title>
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="">
    <link rel="shortcut icon" href="<!--$SCS_SITE_PATH-->/favicon.ico">

    <!--$SCS_RENDER_INFO-->
    <!--$SCS_SITE_HEADER-->
    <!--$SCS_PAGE_HEADER-->

    <!-- Get the query parameter and convert it into a Sites Macro value so that it can be used in the OOTB Content List Component -->
    <script type="text/javascript">
        var createMacros = function () {
            if (SCSRenderAPI.placeholderContent.contentType === "CSI-FAQ") {
                window.SCSMacros = window.SCSMacros || {};
                $.ajax({
                    url: window.location.origin + '/content/published/api/v1.1/items/' + SCSRenderAPI.placeholderContent.contentId + '?channelToken=' + SCS.siteInfo.properties.channelAccessTokens[0].value,
                    async: false,
                    success: function (itemdata) {
                        var fields = itemdata.fields;
                        var CategoryQuery = 'fields.query_category mt "' + fields.query_category.replace(/[^a-zA-Z ']/g, " ") + '"';
                        var ItemsIDs = [];
                        $.ajax({
                            url: '/content/published/api/v1.1/items/?q=(type eq "' + SCSRenderAPI.placeholderContent.contentType + '")' + ' and (' + CategoryQuery + ')' + '&fields=ALL&orderBy=updatedDate:des&channelToken=' + SCS.siteInfo.properties.channelAccessTokens[0].value,
                            async: false,
                            success: function (data) {
                                var IdsQuery = "";
                                for (var i = 0; i < data.items.length; i++) {
                                    if (data.items[i].id !== itemdata.id) {
                                        ItemsIDs.push(data.items[i].id);
                                    }
                                }
                                if (ItemsIDs.length > 0) {
                                    IdsQuery = 'id eq "' + ItemsIDs[0] + '"';
                                }
                                for (var i = 1; i < ItemsIDs.length; i++) {
                                    IdsQuery = IdsQuery + ' or id eq "' + ItemsIDs[i] + '"';
                                }
                                window.SCSMacros.IdsQuery = IdsQuery;
                            },
                            error: function () {
                                console.log("Error in getting category query");
                            }
                        });
                        console.log(CategoryQuery);
                    },
                    error: function () {
                        console.log("Error in getting FAQ INFO");
                    }
                });
            }
        }
        document.addEventListener('scsrenderstart', createMacros, false);
    </script>
</head>
