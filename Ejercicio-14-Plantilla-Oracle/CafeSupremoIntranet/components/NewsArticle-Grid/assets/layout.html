<a href="{{scsData.detailPageLink}}" class="newsArticle-grid-link">
	<div class="newsArticle-grid">
		<div class="contentItem" id="{{id}}-content">
			<div class="contentText">
				<div class="date">{{formattedDate}}</div>
				<div class="name">{{name}}</div>
				<br>
				<div class="description">{{description}}</div>
			</div>
		</div>

		<img class="contentItemImage" id="{{id}}-image" src="{{imageURL}}" alt="{{name}}" data-asset-operation="view:{{fields.newsarticle_image.id}}">
	</div>
</a>
