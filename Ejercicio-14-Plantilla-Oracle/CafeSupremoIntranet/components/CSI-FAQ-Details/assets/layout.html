{{#fields}}
<div class="CSI-FAQ-Details">
    <div class="Category">
        {{query_category}}
    </div>
    <h1 class="Query">{{query}}</h1>
    <div class="PublishedInfo">
        <span>
            {{formattedpublishedDate}}
        </span> 
        <span>
            {{formattedupdatedDate}}
        </span> 
    </div>
    <div class="Question">
        {{query}}
    </div>
    <div class="Answer">
        {{{query_description}}}
    </div>
    <div class="ShareOptions">
        <a href="{{emailLink}}">
            Email This Page
        </a>      
    </div> 
</div>
{{/fields}}
