<!DOCTYPE html>
<html lang="en">
	<head>
		<meta http-equiv="content-type" content="text/html; charset=UTF-8">

		<title>Search Button</title>

		<!-- include sample apps styling -->
		<link href="/_sitescloud/renderer/app/sdk/css/app-styles.css" rel="stylesheet">

		<!-- include supporting files -->
		<script type="text/javascript" src="/_sitescloud/renderer/app/apps/js/knockout.min.js"></script>
		<script type="text/javascript" src="/_sitescloud/renderer/app/apps/js/jquery.min.js"></script>

		<!-- include Sites SDK -->
		<script type="text/javascript" src="/_sitescloud/renderer/app/sdk/js/sites.min.js"></script>

		<style>
			body {
				background:transparent;
				background-image:none;
			}
			.settings-select, .settings-input {
				margin-bottom: 10px;
			}
			.settings-label {
				display: inline-block;
				padding-top: 5px;
				padding-bottom: 5px;
			}
			.settings-checkbox {
				display: block;
				margin: 0px 5px 5px 5px;
			}
		</style>

	</head>

	<body data-bind="visible: true" style="display:none">

		<!-- ko if: initialized -->
		<label for="rightNowDomainName" class="settings-label">Domain Name</label>
		<input id="rightNowDomainName" type="text" class="settings-input settings-text-box" placeholder="example: custhelp.com" data-bind="value: rightNowDomainName">
		<label for="rightNowSiteName" class="settings-label">Site Name</label>
		<input id="rightNowSiteName" type="text" class="settings-input settings-text-box" placeholder="example: mySite" data-bind="value: rightNowSiteName">
		<label for="rightNowMaxResults" class="settings-label">Max Results (value between 1 and 100)</label>
		<input id="rightNowMaxResults" type="number" class="settings-input settings-text-box" data-bind="value: rightNowMaxResultsComputed" min="1" max="100" placeholder="example: 10">
		<!-- /ko -->

		<script type="text/javascript">

			// Get URL parameters of loaded iframe
			var urlParams = {};
			window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(str, key, value) {
				urlParams[key] = value;
			});
			var settingsId = urlParams['id'];

			// Fix scrolling in panel after render
			ko.bindingHandlers.renderFixBindingHandler = {
				update: function(element, valueAccessor, allBindings, viewModel, bindingContext) {
					if (settingsId) {
						var $iframe = $('iframe#' + settingsId, window.parent.document);
						var height = $iframe.attr('height');
						var padding = parseInt($iframe.css('padding-top')) + parseInt($iframe.css('padding-bottom'));
						$iframe.height(height - padding);
					}
				}
			};

			// define the viewModel object
			var SettingsViewModel = function() {
				'use strict';

				var self = this;
				self.contentTypeMap = {};
				self.saveData = false;
				self.initialized = ko.observable(false);

				// ViewModel properties
				var properties = [
					'rightNowDomainName',
					'rightNowSiteName',
					'rightNowMaxResults'
				];

				// Create observables for properties
				$.each(properties, function(i, propName) {
					self[propName] = ko.observable();
				});

				self.rightNowMaxResultsComputed = ko.computed({
					read: function() {
						return self.rightNowMaxResults();
					},
					write: function(value) {
						self.rightNowMaxResults(value);
						if (value < 1 || value > 100) {
							self.rightNowMaxResults(10);
						}
					}
				});

				// Get customSettingsData
				SitesSDK.getProperty('customSettingsData', function(data) {

					// Set observables values
					$.each(properties, function(i, propName) {
						self[propName](data[propName]);
					});

					// note that viewModel is initialized and can start saving data
					self.initialized(true);
					self.saveData = true;
				});

				// Set customSettingsData
				self.save = ko.computed(function() {

					// Set custom settings
					var saveconfig = {};
					$.each(properties, function(i, propName) {
						if (self[propName]) {
							saveconfig[propName] = self[propName]();
						}
					});

					if (self.saveData && (saveconfig.rightNowMaxResults > 0 && saveconfig.rightNowMaxResults <= 100)) {
						SitesSDK.setProperty('customSettingsData', saveconfig);
						console.log("Settings saved customSettingsData: ", saveconfig);
					}
				}, self);
			};

			ko.applyBindings(new SettingsViewModel());

		</script>
	</body>
</html>
