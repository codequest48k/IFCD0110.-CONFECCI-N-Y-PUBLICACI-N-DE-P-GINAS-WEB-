<!DOCTYPE html>
<html lang="en">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

	<title>Sample Custom Component</title>

	<!-- include sample apps styling -->
	<link href="/_sitescloud/renderer/app/sdk/css/app-styles.css" rel="stylesheet">

	<!-- include supporting files -->
	<script type="text/javascript" src="/_sitescloud/renderer/app/apps/js/knockout.min.js"></script>
	<script type="text/javascript" src="/_sitescloud/renderer/app/apps/js/jquery.min.js"></script>

	<!-- include the Sites SDK -->
	<script type="text/javascript" src="/_sitescloud/renderer/app/sdk/js/sites.min.js"></script>
</head>

<body data-bind="visible: true" style="display:none; margin:0px; padding:10px;background:transparent;background-image:none;">
	<!-- ko if: initialized -->
	<div class="scs-component-settings">
		<div>
			<!-- Custom Embed Url -->
			<label id="renderUrlLabel" for="renderUrl" class="settings-heading" data-bind="text: 'EMBED URL'"></label>
			<input id="renderUrl" data-bind="value: renderUrl" class="settings-text-box" style="margin-bottom: 10px;">
			<!-- Custom Iframe Title-->
			<label id="iframeTitleLabel" for="iframeTitle" class="settings-heading" data-bind="text: 'iframe Title'"></label>
			<input id="iframeTitle" data-bind="value: iframeTitle" class="settings-text-box" style="margin-bottom: 10px;">
			<!-- Custom Iframe Height-->
			<label id="iframeHeightLabel" for="iframeHeight" class="settings-heading" data-bind="text: 'iframe Height'"></label>
			<input id="iframeHeight" data-bind="value: iframeHeight" class="settings-text-box" style="margin-bottom: 10px;">
		</div>
	</div>
	<!-- /ko -->
	<!-- ko ifnot: initialized -->
	<div data-bind="text: 'waiting for initialization to complete'" class="settings-heading"></div>
	<!-- /ko -->
	<script type="text/javascript">
		// set the iFrame height when we've fully rendered
		ko.bindingHandlers.scsCompComponentImpl = {
			init: function (element, valueAccessor, allBindings, viewModel, bindingContext) {
				var body = document.body,
					html = document.documentElement;

				SitesSDK.setHeight(Math.max(
					body.scrollHeight,
					body.offsetHeight,
					html.clientHeight,
					html.scrollHeight,
					html.offsetHeight));
			}
		};

		// define the viewModel object
		var SettingsViewModel = function () {
			var self = this;

			// create the observables for passing data
			self.renderUrl = ko.observable();
			self.iframeTitle = ko.observable();
			self.iframeHeight = ko.observable();

			// create rest of viewModel
			self.initialized = ko.observable(false);
			self.saveData = false;

			// Get custom settings
			SitesSDK.getProperty('customSettingsData', function (data) {
				//update observables
				self.renderUrl(data.renderUrl);
				self.iframeTitle(data.iframeTitle);
				self.iframeHeight(data.iframeHeight);

				// note that viewModel is initialized and can start saving data
				self.initialized(true);
				self.saveData = true;
			});


			// save whenever any updates occur
			self.save = ko.computed(function () {
				var saveconfig = {
					'renderUrl': self.renderUrl(),
					'iframeTitle': self.iframeTitle(),
					'iframeHeight': self.iframeHeight()
				};

				// save data in page
				if (self.saveData) {
					SitesSDK.setProperty('customSettingsData', saveconfig);
				}
			}, self);
		};


		// apply the bindings
		ko.applyBindings(new SettingsViewModel());
	</script>
</body>
</html>
